spring:
  application:
    name: reconciliation-engine

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recon}
    username: ${DB_USER:recon}
    password: ${DB_PASSWORD:recon}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-there-must-be-at-least-32-bytes}
    issuer: reconciliation-engine
    access-token-ttl: PT8H
  storage:
    root: ${STORAGE_ROOT:./data/settlement-files}
  matching:
    date-window: PT72H
    amount-tolerance-minor: 2
    min-heuristic-confidence: 0.70
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed:
    users: ${SEED_USERS:true}
    default-password: ${SEED_PASSWORD:recon-demo-2026}
  stripe:
    enabled: ${STRIPE_ENABLED:false}
    api-key: ${STRIPE_API_KEY:}
    connect-timeout: PT5S
    read-timeout: PT20S

logging:
  level:
    org.springframework.batch: INFO
